 // TQC: một nhóm nhiệm vụ số 3, nguồn chỉ khác chú thích (Ngày thực hiện T-1).
 if(s?.role==='TQC'&&s?.processCode==='KQ_TQDN'&&/^3\.\s*Chuẩn bị tiền tiếp quỹ đầu ngày/i.test((s.l1||'').trim()))
  return '3. Chuẩn bị tiền tiếp quỹ đầu ngày';
 // CBVC: L1 số 8 là MỘT nhóm; các dòng L2 mô tả thêm hành trình quay về TS.
 if(s?.role==='CBVC'&&s?.processCode==='KQ_TQDN'&&/^8\.\s*Nhận tiền và vận chuyển tiền đến PGD/i.test((s.l1||'').trim()))
  return '8. Nhận tiền và vận chuyển tiền đến PGD';
 return s?.l1||'';
}
function groups(){const a=[];roleData().filter(s=>s.processCode===state.process).forEach(s=>{const name=visibleL1(s);if(!a.includes(name))a.push(name)});return a}
function steps(){return roleData().filter(s=>s.processCode===state.process&&visibleL1(s)===state.l1)}
function go(s){state.screen=s;save();render();window.scrollTo(0,0)}
function back(){if(isReason())return;switch(state.screen){case'start':return;case'profile':case'manual':go('start');break;case'process':go('profile');break;case'l1':go('process');break;case'l2':go('l1');break;case'measure':go((step()?.manual)?'manual':'l2');break;default:go('start')}}
function home(){if(isReason())return;go('start')}
function button(label,action,cls='primary',extra=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
function render(){const app=$('app');$('navBack').classList.toggle('hidden',state.screen==='start');$('navHome').classList.toggle('hidden',state.screen==='start');
 if(state.screen==='start')app.innerHTML=startScreen();
 else if(state.screen==='profile')app.innerHTML=profileScreen();
 else if(state.screen==='process')app.innerHTML=processScreen();
 else if(state.screen==='l1')app.innerHTML=l1Screen();
 else if(state.screen==='l2')app.innerHTML=l2Screen();
 else if(state.screen==='manual')app.innerHTML=manualScreen();
 else if(state.screen==='measure')app.innerHTML=measureScreen();
 else app.innerHTML=startScreen();
 tick();}

function manualScreen(){const m=state.manual;return `<section class="screen"><div class="panel"><div class="eyebrow">Đo thao tác tự khai báo</div><h2 class="title">Tự nhập quy trình và L2</h2><div class="form-grid"><div><label>Chức danh *</label><select id="manualRole"><option value="">-- Chọn chức danh --</option>${ROLES.map(r=>`<option value="${E(r.role)}" ${r.role===state.profile.role?'selected':''}>${E(r.role)} · ${E(r.name)}</option>`).join('')}<option value="KHÁC" ${state.profile.role==='KHÁC'?'selected':''}>Khác</option></select></div><div><label>Đơn vị / Chi nhánh (tùy chọn)</label><select id="manualUnit"><option value="">-- Chọn --</option>${['VCBC HCM','VCBC HN','Hub HP'].map(x=>`<option ${state.profile.unit===x?'selected':''}>${x}</option>`).join('')}</select></div>${field('manualObserver','User đo lường (tùy chọn)',state.profile.observer)}${field('manualOperator','User tác nghiệp (tùy chọn)',state.profile.operator)}${field('manualProcessCode','Mã quy trình (tùy chọn)',m.processCode)}${field('manualProcess','Tên quy trình (tùy chọn)',m.process)}${field('manualL1','Nhóm L1 (nếu có)',m.l1)}<div class="field-wide"><label>Thao tác L2 (có thể bổ sung sau)</label><textarea id="manualL2">${E(m.l2)}</textarea></div>${field('manualStepCode','Mã bước (tùy chọn)',m.stepCode)}${field('manualMeasureUnit','Đơn vị đo (đơn vị tính) *',m.unit)}${field('manualFreq','Tần suất đo',m.frequency)}</div><div class="footer-actions">${button('VÀO MÀN ĐO →','manualNext')}</div></div></section>`}
function codeDateTime(ts=now()){
 const p=Object.fromEntries(tFormat.formatToParts(new Date(ts)).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
 return `${p.day}${p.month}${p.year.slice(-2)}${p.hour}${p.minute}${p.second}`;
}
function codeShortRole(role){return String(role||'JD').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase()||'JD'}
function processShortCode(s){
 const template=String(s?.codeTemplate||'');
 const found=template.match(/dd\/mm\/yy(.*?)0x/i);
 if(found&&found[1])return found[1].replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
 return codeShortRole((s?.sourceProcessCode||s?.processCode||'QT').replace(/^(?:KQ|NQ)_/,''));
}
function generatedCode(s,ts=now()){
 return `${codeShortRole(s.role)}_${codeDateTime(ts)}${processShortCode(s)}`;
}

// Một phiên gắn với cùng đơn vị, cán bộ đo, chức danh và quy trình.
// Không đánh số theo L1/L2; một bước có thể đo nhiều lần trong cùng phiên.
function sessionOwner(s,profile=state.profile){return [String(profile.unit||'').trim().toLowerCase(),String(profile.observer||'').trim().toLowerCase(),String(profile.operator||'').trim().toLowerCase(),s.role,s.processCode].join('|')}
function activeSession(s,profile=state.profile){if(!s)return null;const owner=sessionOwner(s,profile);return (state.measureSessions||[]).find(x=>x.status==='ACTIVE'&&x.owner===owner)||null}
function sessionCode(s){return activeSession(s)?.code||generatedCode(s)}
function ensureSession(s){let session=activeSession(s);if(session)return session;
 const started=now();const code=generatedCode(s,started);session={id:'session_'+started+'_'+Math.random().toString(36).slice(2,9),owner:sessionOwner(s),role:s.role,processCode:s.processCode,code,start:started,status:'ACTIVE'};
 (state.measureSessions??=[]).push(session);save();return session}
function endSession(){if(isReason())return;const current=step();const s=(current?.role===state.profile.role&&current?.processCode===state.process)?current:roleData().find(x=>x.processCode===state.process);if(!s)return;const session=activeSession(s);if(!session){alertMsg('Chưa có phiên đang hoạt động.');return}
 if(state.runs.some(r=>r.sessionId===session.id||(!r.sessionId&&r.code===session.code&&r.step?.processCode===s.processCode))){alertMsg('Vẫn còn mẫu đang đo của phiên này. Hãy STOP hoặc hủy các mẫu pending trước khi kết thúc phiên.');return}
 session.status='CLOSED';session.end=now();state.selectedRunId='';state.draft=newStepDraft(s);save();go(s.manual?'manual':'process')}
function memoryKey(label){return String(label||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function extraFieldDefinitions(s){const fields=Array.isArray(s?.extraCols)&&s.extraCols.length?s.extraCols:(s?.special?[{col:'NOTE_QTY',label:/Số tiền/i.test(s.special)?'Số tiền':/PGD|CN/i.test(s.special)?'Số PGD / CN':/ATM|máy/i.test(s.special)?'Số máy ATM':/lệnh/i.test(s.special)?'Số lệnh':'Số lượng cần bổ sung'}]:[]);return fields}
function rememberSpecial(s,values){if(!s||!values)return;state.extraMemory=state.extraMemory||{};for(const f of extraFieldDefinitions(s)){const v=String(values['x'+f.col]??'').trim();if(v)state.extraMemory[memoryKey(f.label)]=v}}
function newStepDraft(s,pending=null){
 const special={};
 for(const f of extraFieldDefinitions(s)){
   const key='x'+f.col;
   // Giá trị thuộc phiên đang đo ưu tiên tuyệt đối; chưa có phiên dùng lần nhập gần nhất của tên trường.
   if(pending && Object.prototype.hasOwnProperty.call(pending.special||{},key))special[key]=pending.special[key];
   else special[key]=state.extraMemory?.[memoryKey(f.label)]??'';
 }
 return {code:pending?.code||sessionCode(s),note:pending?.note||'',special};
}
function pendingForStep(s){return state.runs.filter(x=>x.step.id===s?.id&&sessionOwner(x.step,x.profile)===sessionOwner(s))}
function specialFields(s,r){
 const extras=Array.isArray(s?.extraCols)?s.extraCols:[];
 const prompt=String(s?.special||'').trim();
 if(!extras.length&&!prompt)return '';
 const cur=r?.special||state.draft.special||{};
 const desc=prompt?`<div class="special-description">${E(prompt)}</div>`:'';
 const fields=extras.length?extras:[{col:'NOTE_QTY',label: /Số tiền/i.test(prompt)?'Số tiền':/PGD|CN/i.test(prompt)?'Số PGD / CN':/ATM|máy/i.test(prompt)?'Số máy ATM':/lệnh/i.test(prompt)?'Số lệnh':'Số lượng cần bổ sung'}];
 let result='';
 for(const f of fields){
  const k='x'+f.col, label=String(f.label||f.col), required=Boolean(f.required);
  const monetary=/số tiền/i.test(label), formType=/hình thức/i.test(label), isText=formType||!/số|SL|lượng/i.test(label);
  const value=cur[k]??state.extraMemory?.[memoryKey(label)]??'';
  if(formType){result+=`<div class="extra-row"><label>${E(label)} ${required?'*':''}</label><select data-special="${k}"><option value="">-- Chọn hình thức --</option>${['Nguyên bó','Tiền lẻ','Nguyên bó và tiền lẻ'].map(x=>`<option value="${E(x)}" ${value===x?'selected':''}>${E(x)}</option>`).join('')}</select></div>`;}
  else result+=`<div class="extra-row"><label>${E(label)} ${required?'*':''}</label><input type="${isText?'text':'number'}" inputmode="${isText?'text':monetary?'decimal':'numeric'}" ${isText?'':`min="0" step="${monetary?'any':'1'}"`} data-special="${k}" value="${E(value)}" placeholder="Nhập ${E(label.toLowerCase())}"></div>`;
 }
 return `<section class="special" id="extraFieldsSection"><h3>THÔNG TIN BỔ SUNG THEO BƯỚC</h3>${desc}<div class="special-grid">${result}</div></section>`;
}
function measureScreen(){const s=step();if(!s)return `<section class="screen"><div class="panel">Chưa chọn thao tác.</div></section>`;const r=run(),m=r?calc(r):{total:0,hold:0,net:0};return `<section class="screen"><div class="panel measure-stick"><div class="eyebrow">${s.manual?'Đo tự nhập':'Đo theo danh mục'} · ${E(s.role)} · ${E(s.processCode)}</div><div class="rowflex"><h2 class="title" style="max-width:840px">${E(s.process)}</h2><span class="status ${r?.activeHold?'hold':''}" id="runStatus">${r?(r.activeHold?'ĐANG HOLD':'ĐANG ĐO'):'CHƯA START'}</span></div><div class="info-card l1"><b>NHÓM CÔNG VIỆC L1</b><div>${E(s.l1||'Không có L1')}</div></div><div class="info-card l2"><b>THAO TÁC L2</b><div>${E(s.l2)}</div></div><div class="tags"><span class="tag green">${E(s.stepCode||'Tự nhập')}</span><span class="tag orange">Đơn vị đo · ${E(s.unit||'Lần')}</span><span class="tag">${E(s.frequency||'Theo phát sinh')}</span></div><div class="form-grid"><div>${field('measureCode','MÃ GIAO DỊCH · DÙNG CHUNG CHO PHIÊN',r?.code??sessionCode(s),'readonly aria-readonly="true"')}</div><div>${field('measureNote','Ghi chú thao tác (nếu có)',r?.note??state.draft.note)}</div></div>${specialFields(s,r)}<div class="tools"><button type="button" class="tool" style="--c:#c17c18" data-action="info">${icon.info} THÔNG TIN L1 / L2</button><button type="button" class="tool" style="--c:#2677bc" data-action="viewSaved">${icon.saved} MẪU ĐÃ LƯU</button><button type="button" class="tool" style="--c:#bd7b18" data-action="viewHolds">${icon.hold} LỊCH SỬ HOLD</button><button type="button" class="tool" style="--c:#af456e" data-action="viewPending">${icon.pending} MẪU ĐANG PENDING</button></div><div class="control-bar"><div class="time total"><span>TỔNG THỜI GIAN</span><b id="timeTotal">${clock(m.total)}</b></div><div class="time net"><span>SUT</span><b id="timeNet">${clock(m.net)}</b></div></div><div class="metrics"><span class="stamp" id="startStamp">START (GMT+7): ${stamp(r?.start)}</span><span class="stamp">·</span><button type="button" class="mini hold-time-btn" data-action="viewHolds" title="Xem lịch sử HOLD của riêng bước L2 này">HOLD TIME: <b id="timeHold">${clock(m.hold)}</b> · ${r?.holds.length||0} / 5 lần</button></div><div class="actions"><button id="startBtn" class="primary" data-action="start" ${r?'disabled':''}>▶ START</button><button id="stopBtn" class="danger" data-action="stop" ${!r||r.activeHold?'disabled':''}>■ STOP</button><button id="holdBtn" class="amber" data-action="hold" ${!r||(!r.activeHold&&r.holds.length>=5)?'disabled':''}><span class="pause-icon"><i></i><i></i></span>${r?.activeHold?'STOP HOLD':'HOLD'}</button><button class="secondary" data-action="discard" ${!r?'disabled':''}>✕ BỎ MẪU</button></div><div class="session-foot"><span>Phiên: <b>${E(r?.code||sessionCode(s))}</b></span><button type="button" class="secondary" data-action="endSession">KẾT THÚC PHIÊN</button></div><p class="muted-note">${r?'Chuyển màn vẫn giữ thời gian, có thể quay lại phiên trong Mẫu đang pending.':'Các bước L2 trong cùng phiên dùng chung mã. Nhấn STOP để lưu rồi chọn bước tiếp theo.'}</p></div></section>`}
function alertMsg(msg){window.alert(msg)}
function setProfileFromForm(){const role=$('role')?.value,unit=$('unit')?.value,observer=$('observer')?.value.trim(),operator=$('operator')?.value.trim(),transCode='';if(!role||!unit||!observer||!operator){alertMsg('Vui lòng nhập đủ chức danh, đơn vị, User đo lường và User tác nghiệp.');return false}state.profile={role,unit,observer,operator,transCode};save();return true}
function setManualFromForm(){const fields={role:$('manualRole')?.value,unit:$('manualUnit')?.value,observer:$('manualObserver')?.value.trim(),operator:$('manualOperator')?.value.trim(),processCode:$('manualProcessCode')?.value.trim(),process:$('manualProcess')?.value.trim(),l1:$('manualL1')?.value.trim(),l2:$('manualL2')?.value.trim(),stepCode:$('manualStepCode')?.value.trim(),measureUnit:$('manualMeasureUnit')?.value.trim(),frequency:$('manualFreq')?.value.trim(),code:''};if(!fields.role||!fields.measureUnit){alertMsg('Chỉ cần chọn CHỨC DANH và nhập ĐƠN VỊ ĐO (đơn vị tính).');return false}
 state.profile={role:fields.role,unit:fields.unit,observer:fields.observer,operator:fields.operator,transCode:fields.code};state.manual={processCode:fields.processCode,process:fields.process,l1:fields.l1,l2:fields.l2,stepCode:fields.stepCode,unit:fields.measureUnit,frequency:fields.frequency};
 const jd=ROLES.find(x=>x.role===fields.role)?.jd||'';state.manualStep={id:'manual|'+Date.now()+'|'+Math.random().toString(36).slice(2,8),role:fields.role,jd,processCode:fields.processCode,process:fields.process,l1:fields.l1,l2:fields.l2,stepCode:fields.stepCode,unit:fields.measureUnit,frequency:fields.frequency,special:'',sheet:'Khác',manual:true};state.stepId='';state.selectedRunId='';ensureSession(state.manualStep);state.draft=newStepDraft(state.manualStep);go('measure');return true}
function selectedSpecial(){const out={};document.querySelectorAll('#app [data-special]').forEach(el=>out[el.dataset.special]=el.value);return out}
function syncDraft(){if(state.screen!=='measure')return;const r=run(),special=selectedSpecial();rememberSpecial(step(),special);if(r){r.note=$('measureNote')?.value||'';r.special=special}else{state.draft={code:sessionCode(step()),note:$('measureNote')?.value||'',special}}save()}
function validateSpecial(s,v){
 for(const f of extraFieldDefinitions(s)){
  if(f.required&&!String(v?.['x'+f.col]??'').trim()){
   alertMsg('Vui lòng nhập trường bắt buộc: '+String(f.label||f.col));return false;
  }
 }
 return true;
}
function start(){syncDraft();const s=step();if(!s||run())return;const d=state.draft;
 if(!validateSpecial(s,d.special))return;const session=ensureSession(s);rememberSpecial(s,d.special);
 const id='run_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
 state.runs.push({id,sessionId:session.id,step:structuredFallback(s),profile:structuredFallback(state.profile),code:session.code,note:d.note,special:structuredFallback(d.special),start:now(),end:null,holds:[],activeHold:null});
 state.selectedRunId=id;save();render()}
function stop(){const r=run();if(!r||r.activeHold)return;syncDraft();r.end=now();
 state.records.push(structuredFallback(r));state.runs=state.runs.filter(x=>x.id!==r.id);state.selectedRunId='';state.draft=newStepDraft(r.step);save();
 // STOP không hiển thị popup và quay lại màn chọn L2; phiên chung vẫn ACTIVE.
