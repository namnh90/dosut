:root{

  --sut-blue:#2077b9;--sut-blue-dark:#125d96;

 const present=new Set(sutStepsForUnit(unit).map(s=>s.role));
 const all=sutUnitSystem(unit)==='HUB'?(CATALOG.hubRoles||[]):ROLES;
 const rows=all.filter(r=>present.has(r.role));
 return rows.map(r=>({...r,jd:sutUnitSystem(unit)==='HUB'? (sutStepsForUnit(unit).find(s=>s.role===r.role)?.jd||r.jd||''):r.jd}));
}
function sutHeadersForStep(step){const k=`${step?.role}|${step?.sheet}`;return (step?.sourceSystem==='HUB'?CATALOG.hubHeaders[k]:CATALOG.headers[k])||[];}

 return SUT_UNITS.map(unit=>`<option value="${E(unit)}" ${value===unit?'selected':''}>${E(unit)}</option>`).join('');
}

 openModal('TRUY CẬP QUẢN TRỊ SUT',`<div class="sut-admin-panel">Để xem tất cả mẫu đã STOP, mẫu CANCELLED và DELETED, nhập mật khẩu quản trị. Quyền được xác minh ở Power Automate; HTML không lưu mật khẩu.<label for="sutAdminPasswordInput" style="margin-top:12px">MẬT KHẨU ADMIN</label><input id="sutAdminPasswordInput" type="password" autocomplete="off" placeholder="Mật khẩu quản trị" style="width:100%;min-height:42px"></div>`,button('HỦY','closeModal','secondary')+button('XÁC NHẬN & LẤY MẪU','sutAdminConfirm','primary'),'read');

async function sutGetRemote(adminRequest=false){
 if(sutGetBusy)return;
 // Đọc trực tiếp nội dung ô ngoài đề phòng user bấm TẢI ngay sau khi nhập.
 const input=document.getElementById('sutObserverHome');
 if(input)sutStoreObserver(input.value);
 const observer=sutObserver();
 if(!observer){sutHttpStatus='LỖI: Hãy nhập NGƯỜI ĐO LƯỜNG trước khi lấy mẫu từ SharePoint';sutStatusRefresh();input?.focus();return;}
 if(sutAdminMode()&&!adminRequest){sutAskAdmin();return;}
 if(adminRequest&&!sutAdminPassword){sutAskAdmin();return;}
 sutGetBusy=true;
 sutHttpStatus=adminRequest?'Đang xác thực Admin và lấy mẫu từ SharePoint về thiết bị…':'Đang lấy mẫu của '+observer+' từ SharePoint về thiết bị…';sutStatusRefresh();
 try{
  const res=await fetch(SUT_HTTP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'GET',requestId:sutUUID(),data:adminRequest?{mode:'ADMIN',adminPassword:sutAdminPassword,top:5000}:{observer,top:500}}),cache:'no-store'});
  const raw=await res.text();let result;
  try{result=JSON.parse(raw||'{}')}catch{throw Error('Response GET không phải JSON: '+raw.slice(0,110))}
  if(!res.ok||result.success===false)throw Error(result.message||result.error||('HTTP '+res.status));
  const items=Array.isArray(result.items)?result.items:Array.isArray(result.data?.items)?result.data.items:Array.isArray(result.data)?result.data:null;
  if(!items)throw Error('Flow chưa trả items[]; kiểm tra Select_SUT_GET và Response');
  if(adminRequest){
   if(result.adminAuthorized!==true)throw Error('Flow chưa xác thực Admin (adminAuthorized=true). Không mở dữ liệu toàn hệ thống.');
   const adminRows=[];let ignoredAdmin=0;
   for(const item of items){
    let r;try{const val=item.DataJSON??item.dataJSON;r=typeof val==='string'?JSON.parse(val):val}catch{ignoredAdmin++;continue}
    if(!sutValidRemoteRun(r)){ignoredAdmin++;continue}
    const status=String(item.Status||item.status||r.status||'').toUpperCase();
    if(!['STOPPED','CANCELLED','DELETED'].includes(status)){continue}
    r._remoteStatus=status;r._remoteIsDeleted=(status==='CANCELLED'||status==='DELETED');
    r._syncRevision=Number(item.Revision||r._syncRevision||0);
    adminRows.push(r);
   }
   sutAdminRecords=adminRows;sutAdminVerified=true;sutAdminPassword='';
   sutHttpStatus=`ADMIN: ${adminRows.length} mẫu đã đo/hủy/xóa được tải · ${ignoredAdmin} dòng lỗi`;
   sutStatusRefresh();viewAdmin();return;
  }
  const queuedIds=new Set(sutQueueRead().map(x=>x.runId));
  let added=0,updated=0,sessions=0,ignored=0;
  const restore=[];
  for(const item of items){
   let r;try{const val=item.DataJSON??item.dataJSON;r=typeof val==='string'?JSON.parse(val):val}catch{ignored++;continue}
   if(!sutValidRemoteRun(r)){ignored++;continue}
   // Không dùng tên người trong GET làm cơ chế bảo mật, nhưng kiểm tra lại
   // snapshot để chặn dữ liệu người khác bị đưa nhầm vào cache.
   if(String(r.profile.observer||'').trim().toLocaleLowerCase('vi-VN')!==observer.toLocaleLowerCase('vi-VN')){ignored++;continue}
   const status=String(item.Status||item.status||r.status||'').toUpperCase();
   const oldPending=state.runs.find(x=>x.id===r.id);
   const oldStopped=state.records.find(x=>x.id===r.id);
   if(queuedIds.has(r.id)){ignored++;continue} // không ghi đè thay đổi local chưa gửi
   if(status==='DELETED'||status==='CANCELLED'||item.IsDeleted===true||String(item.IsDeleted).toLowerCase()==='true'){
    state.runs=state.runs.filter(x=>x.id!==r.id);
    state.records=state.records.filter(x=>x.id!==r.id);
    continue;
   }
   if(!['RUNNING','HOLD','STOPPED'].includes(status)){ignored++;continue}
   r.start=Number(r.start);
   if(r.end!=null)r.end=Number(r.end);
   r.holds=(Array.isArray(r.holds)?r.holds:[]).map(h=>({...h,start:Number(h.start??Date.parse(h.startUTC)),end:h.end==null?(h.stopUTC?Date.parse(h.stopUTC):null):Number(h.end)}));
   if(r.activeHold){r.activeHold={...r.activeHold,start:Number(r.activeHold.start??Date.parse(r.activeHold.startUTC)),end:r.activeHold.end==null?null:Number(r.activeHold.end)}}
   r.sessionId=r.sessionId||r.session?.id||r.session?.sessionId||item.SessionID||'';
   r._syncRevision=Math.max(Number(r._syncRevision||0),Number(item.Revision||0));
   if(status==='STOPPED'){
    state.runs=state.runs.filter(x=>x.id!==r.id);
    const ix=state.records.findIndex(x=>x.id===r.id);
    if(ix<0){state.records.push(r);added++}
    else if(Number(state.records[ix]._syncRevision||0)<=r._syncRevision){state.records[ix]=r;updated++}
   }else{
    // Mẫu đã được STOP trên máy này thì không phục hồi ngược thành RUNNING.
    if(oldStopped)continue;
    const ix=state.runs.findIndex(x=>x.id===r.id);
    if(ix<0){state.runs.push(r);added++}
    else if(Number(state.runs[ix]._syncRevision||0)<=r._syncRevision){state.runs[ix]=r;updated++}
   }
   restore.push({r,item});
  }
  for(const x of restore)if(sutRestoreSession(x.r,x.item))sessions++;
  save();render();
  sutHttpStatus=`GET ${observer}: ${items.length} dòng · +${added} mẫu · ${updated} cập nhật · ${sessions} phiên phục hồi${ignored?' · '+ignored+' bỏ qua':''}`;
  sutStatusRefresh();
 }catch(e){sutHttpStatus='LỖI TẢI: '+String(e.message||e).slice(0,220);sutStatusRefresh();console.error(e)}
 finally{sutGetBusy=false;if(adminRequest)sutAdminPassword=''}
}

function parallelMappedStep(s){const id=PARALLEL_STEP_MAP[s?.id||''];return id?DATA.find(x=>x.id===id)||null:null}
function parallelEnabledForCurrentStep(){return !!(step()&&!step().manual&&state.parallelPair&&state.parallelPair.mainStepId===step().id)}
function buildParallelSecondaryStep(){if(!parallelEnabledForCurrentStep())return null;const base=DATA.find(x=>x.id===state.parallelPair.secondary.stepId)||parallelMappedStep(step());if(!base)return null;const o=state.parallelPair.secondary.overrides||{};return {...structuredFallback(base),...o,id:base.id,manual:false};}
function parallelSecondaryRun(){const id=state.parallelPair?.secondary?.runId||'';return id?state.runs.find(x=>x.id===id)||null:null}
function syncParallelDrafts(){
 if(!parallelEnabledForCurrentStep())return;
 const sec=state.parallelPair.secondary;
 const main=state.draft||(state.draft=newStepDraft(step()));
 const other=sec.draft||(sec.draft=newStepDraft(buildParallelSecondaryStep()));
 for(const [owner,draft,record] of [['main',main,run()],['secondary',other,parallelSecondaryRun()]]){
  const note=document.querySelector('[data-parallel-note="'+owner+'"]');
  if(note)draft.note=note.value;
  document.querySelectorAll('[data-parallel-special-owner="'+owner+'"]').forEach(el=>{
   draft.special=draft.special||{};
   draft.special[el.dataset.parallelSpecial]=el.value;
  });
  if(record){
   record.note=draft.note||'';
   record.special=structuredFallback(draft.special||{});
  }
 }
 rememberSpecial(step(),main.special||{});
 rememberSpecial(buildParallelSecondaryStep(),other.special||{});
 save();
}

function openParallelSetup(){if(run()||parallelSecondaryRun()){alertMsg('Hãy STOP cặp đang đo trước khi chỉnh.');return}const s=step(),pair=parallelMappedStep(s);if(!s||!pair){alertMsg('Bước này không thuộc nhóm đo song song đã cấu hình.');return}const existing=state.parallelPair&&state.parallelPair.mainStepId===s.id?state.parallelPair.secondary:null;const pr=existing?.profile||{role:pair.role,jd:pair.jd,operator:'',unit:state.profile.unit||'',observer:state.profile.observer||''};const o=existing?.overrides||pair;openModal('THÊM / CHỈNH CẶP ĐO SONG SONG',`<div class="alert">Người đo lường được giữ chung theo màn chính. Bạn chỉ cần khai báo thông tin phía cặp đo song song.</div><div class="form-grid"><div><label>CHỨC DANH</label><input id="pairRole" value="${E(pr.role||pair.role)}"></div><div><label>JD</label><input id="pairJD" value="${E(o.jd||pair.jd)}"></div><div><label>NGƯỜI ĐƯỢC ĐO</label><input id="pairOperator" value="${E(pr.operator||'')}"></div><div><label>MÃ BƯỚC</label><input id="pairStepCode" value="${E(o.stepCode||pair.stepCode)}"></div><div class="field-wide"><label>L1</label><textarea id="pairL1">${E(o.l1||pair.l1)}</textarea></div><div class="field-wide"><label>L2</label><textarea id="pairL2">${E(o.l2||pair.l2)}</textarea></div></div>`,button('HỦY','closeModal','secondary')+button('LƯU CẶP ĐO SONG SONG','saveParallelSetup','primary'),'saved');}
function saveParallelSetup(){const s=step(),pair=parallelMappedStep(s);if(!s||!pair)return;state.parallelPair={mainStepId:s.id,secondary:{stepId:pair.id,profile:{role:$('pairRole')?.value.trim()||pair.role,jd:$('pairJD')?.value.trim()||pair.jd,operator:$('pairOperator')?.value.trim(),unit:state.profile.unit||'',observer:state.profile.observer||''},overrides:{role:$('pairRole')?.value.trim()||pair.role,jd:$('pairJD')?.value.trim()||pair.jd,l1:$('pairL1')?.value.trim()||pair.l1,l2:$('pairL2')?.value.trim()||pair.l2,stepCode:$('pairStepCode')?.value.trim()||pair.stepCode,process:pair.process,processCode:pair.processCode,unit:pair.unit,frequency:pair.frequency,special:pair.special,extraCols:pair.extraCols},draft:state.parallelPair?.secondary?.draft||newStepDraft(pair),runId:state.parallelPair?.secondary?.runId||''}};save();closeModal();render();}

function createRunFor(stepObj,profile,draft,target='main'){const session=ensureSession(stepObj,profile);rememberSpecial(stepObj,draft.special||{});const id='run_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);const rec={id,sessionId:session.id,step:structuredFallback(stepObj),profile:structuredFallback(profile),code:session.code,note:draft.note||'',special:structuredFallback(draft.special||{}),start:now(),end:null,holds:[],activeHold:null};state.runs.push(rec);sutEnqueue('START',rec,'RUNNING');if(target==='main')state.selectedRunId=id;else if(state.parallelPair)state.parallelPair.secondary.runId=id;save();return rec;}

function holdRunById(id){const r=state.runs.find(x=>x.id===id);if(!r)return false;if(r.activeHold){r.activeHold.end=now();save();reasonModal(id);return true}if((r.holds||[]).length>=20){alertMsg('Tối đa 20 lần HOLD cho một mẫu.');return false}r.activeHold={start:now(),end:null};save();sutEnqueue('SYNC',r,'HOLD');render();return true}



function parallelStartAll(){
 if(!parallelEnabledForCurrentStep())return;
 if(run()||parallelSecondaryRun()){alertMsg('Cặp mẫu đang hoạt động, không thể START thêm.');return}
 syncParallelDrafts();
 const first=step(),second=buildParallelSecondaryStep(),sec=state.parallelPair.secondary;
 if(!sec.profile.operator?.trim()){alertMsg('Hãy nhập người được đo cho mẫu thứ hai trước khi START.');return}
 const at=now();
 const pairId='pair_'+at+'_'+Math.random().toString(36).slice(2,8);
 const profile2={...structuredFallback(state.profile),role:sec.profile.role||second.role,
  operator:sec.profile.operator,observer:state.profile.observer,unit:state.profile.unit};
 const spec=[
  {step:first,profile:state.profile,draft:state.draft||newStepDraft(first),owner:'main'},
  {step:second,profile:profile2,draft:sec.draft||newStepDraft(second),owner:'secondary'}
 ];
 const created=[];
 for(const x of spec){
  const session=ensureSession(x.step,x.profile);
  const r={
   id:'run_'+at+'_'+Math.random().toString(36).slice(2,10),
   parallelPairId:pairId,parallelOwner:x.owner,
   sessionId:session.id,step:structuredFallback(x.step),
   profile:structuredFallback(x.profile),code:session.code,
   note:x.draft.note||'',special:structuredFallback(x.draft.special||{}),
   start:at,end:null,holds:[],activeHold:null
  };
  created.push(r);
 }
 state.runs.push(...created);
 state.selectedRunId=created[0].id;
 sec.runId=created[1].id;
 save();
 for(const r of created)sutEnqueue('START',r,'RUNNING');
 render();
}
function parallelStopAll(){
 const a=run(),b=parallelSecondaryRun();
 if(!a||!b){alertMsg('Phải có đủ 2 mẫu đang đo mới được STOP.');return}
 if(a.activeHold||b.activeHold){alertMsg('Cặp mẫu đang HOLD. Hãy STOP HOLD trước.');return}
 syncParallelDrafts();
 const at=now();
 for(const r of [a,b]){
  r.end=at;
  state.records.push(structuredFallback(r));
 }
 state.runs=state.runs.filter(x=>x.id!==a.id&&x.id!==b.id);
 state.selectedRunId='';
 state.parallelPair.secondary.runId='';
 state.draft=newStepDraft(a.step);
 state.parallelPair.secondary.draft=newStepDraft(b.step);
 save();
 for(const r of [a,b])sutEnqueue('STOP',r,'STOPPED');
 render();
}
function parallelHoldAll(){
 const a=run(),b=parallelSecondaryRun();
 if(!a||!b){alertMsg('HOLD song song cần đủ hai mẫu đang đo.');return}
 const both=[a,b],any=both.some(r=>!!r.activeHold);
 if(any){
  if(!both.every(r=>r.activeHold)){alertMsg('Trạng thái HOLD của cặp không đồng nhất. Không thể kết thúc HOLD đồng thời.');return}
  const at=now();
  for(const r of both)r.activeHold.end=at;
  parallelReasonIds=both.map(r=>r.id);
  save();
  reasonModal();
  return;
 }
 if(both.some(r=>(r.holds||[]).length>=20)){alertMsg('Một trong hai mẫu đã đủ 20 lần HOLD.');return}
 syncParallelDrafts();
 const at=now();
 for(const r of both)r.activeHold={start:at,end:null};
 save();
 for(const r of both)sutEnqueue('SYNC',r,'HOLD');
 render();
}

function processes(){const a=new Map();roleData().forEach(s=>{if(!a.has(s.processCode))a.set(s.processCode,s.process)});return [...a].map(([code,name])=>({code,name}))}
function visibleL1(s){
 // TQC: một nhóm nhiệm vụ số 3, nguồn chỉ khác chú thích (Ngày thực hiện T-1).
 if(s?.role==='TQC'&&s?.processCode==='KQ_TQDN'&&/^3\.\s*Chuẩn bị tiền tiếp quỹ đầu ngày/i.test((s.l1||'').trim()))
  return '3. Chuẩn bị tiền tiếp quỹ đầu ngày';
 // CBVC: L1 số 8 là MỘT nhóm; các dòng L2 mô tả thêm hành trình quay về TS.
 if(s?.role==='CBVC'&&s?.processCode==='KQ_TQDN'&&/^8\.\s*Nhận tiền và vận chuyển tiền đến PGD/i.test((s.l1||'').trim()))
  return '8. Nhận tiền và vận chuyển tiền đến PGD';
 return s?.l1||'';
}
function groups(){const a=[];roleData().filter(s=>s.processCode===state.process).forEach(s=>{const name=visibleL1(s);if(!a.includes(name))a.push(name)});return a}
function steps(){return roleData().filter(s=>s.processCode===state.process&&visibleL1(s)===state.l1)}

}
function manualProcessValue(m){if(!m?.process)return '';if(m.process==='Khác')return '__OTHER__';const found=manualProcessChoices().find(x=>x.name===m.process&&x.code===m.processCode);return found?`${found.code}|||${found.name}`:'__OTHER__'}

function codeDateTime(ts=now()){
 const p=Object.fromEntries(tFormat.formatToParts(new Date(ts)).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
 return `${p.day}${p.month}${p.year.slice(-2)}${p.hour}${p.minute}${p.second}`;
}
function codeShortRole(role){return String(role||'JD').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase()||'JD'}
function processShortCode(s){
 const template=String(s?.codeTemplate||'');
 const found=template.match(/dd\/mm\/yy(.*?)0x/i);
 if(found&&found[1])return found[1].replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
 return codeShortRole((s?.sourceProcessCode||s?.processCode||'QT').replace(/^(?:KQ|NQ)_/,''));
}
function generatedCode(s,ts=now()){
 return `${codeShortRole(s.role)}_${codeDateTime(ts)}${processShortCode(s)}`;
}

// Một phiên gắn với cùng đơn vị, cán bộ đo, chức danh và quy trình.
// Không đánh số theo L1/L2; một bước có thể đo nhiều lần trong cùng phiên.
function sessionOwner(s,profile=state.profile){return [String(profile.unit||'').trim().toLowerCase(),String(profile.observer||'').trim().toLowerCase(),String(profile.operator||'').trim().toLowerCase(),s.role,s.processCode].join('|')}
function activeSession(s,profile=state.profile){if(!s)return null;const owner=sessionOwner(s,profile);return (state.measureSessions||[]).find(x=>x.status==='ACTIVE'&&x.owner===owner)||null}
function sessionCode(s){return activeSession(s)?.code||generatedCode(s)}
function ensureSession(s,profile=state.profile){let session=activeSession(s,profile);if(session)return session;
 const started=now();const code=generatedCode(s,started);session={id:'session_'+started+'_'+Math.random().toString(36).slice(2,9),owner:sessionOwner(s,profile),role:s.role,processCode:s.processCode,code,start:started,status:'ACTIVE'};
 (state.measureSessions??=[]).push(session);save();return session}
function endSession(){if(isReason())return;const current=step();const s=(current?.role===state.profile.role&&current?.processCode===state.process)?current:roleData().find(x=>x.processCode===state.process);if(!s)return;const session=activeSession(s);if(!session){alertMsg('Chưa có phiên đang hoạt động.');return}
 if(state.runs.some(r=>r.sessionId===session.id||(!r.sessionId&&r.code===session.code&&r.step?.processCode===s.processCode))){alertMsg('Vẫn còn mẫu đang đo của phiên này. Hãy STOP hoặc hủy các mẫu pending trước khi kết thúc phiên.');return}
 session.status='CLOSED';session.end=now();resetMeasureCaches();save();go('start')}
function memoryKey(label){return String(label||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function extraFieldDefinitions(s){const fields=Array.isArray(s?.extraCols)&&s.extraCols.length?s.extraCols:(s?.special?[{col:'NOTE_QTY',label:/Số tiền/i.test(s.special)?'Số tiền':/PGD|CN/i.test(s.special)?'Số PGD / CN':/ATM|máy/i.test(s.special)?'Số máy ATM':/lệnh/i.test(s.special)?'Số lệnh':'Số lượng cần bổ sung'}]:[]);return fields}
function rememberSpecial(s,values){if(!s||!values)return;state.extraMemory=state.extraMemory||{};for(const f of extraFieldDefinitions(s)){const v=String(values['x'+f.col]??'').trim();if(v)state.extraMemory[memoryKey(f.label)]=v}}
function newStepDraft(s,pending=null){
 const special={};
 for(const f of extraFieldDefinitions(s)){
   const key='x'+f.col;
   // Giá trị thuộc phiên đang đo ưu tiên tuyệt đối; chưa có phiên dùng lần nhập gần nhất của tên trường.
   if(pending && Object.prototype.hasOwnProperty.call(pending.special||{},key))special[key]=pending.special[key];
   else special[key]=state.extraMemory?.[memoryKey(f.label)]??'';
 }
 return {code:pending?.code||sessionCode(s),note:pending?.note||'',special};
}
function pendingForStep(s){return state.runs.filter(x=>x.step.id===s?.id&&sessionOwner(x.step,x.profile)===sessionOwner(s))}
function alertMsg(msg){window.alert(msg)}

function extraEditFieldsHTML(r){
 const s=r?.step;if(!s)return '<div class="empty">Không có dữ liệu để chỉnh sửa.</div>';
 const fields=extraFieldDefinitions(s);const cur=r.special||{};
 if(!fields.length)return '<div class="empty">Bước này không có trường bổ sung để cập nhật.</div>';
 const labels=fields.map(f=>String(f.label||f.col));
 const isMoneySplit=labels.some(x=>/Tiền lẻ/i.test(x))&&labels.some(x=>/Tiền tròn bó|Chẵn bó/i.test(x));
 let result='';
 if(isMoneySplit){
   result=renderMoneySplitFields(fields,cur,'data-edit-special');
 }else{
   for(const f of fields){
     const k='x'+f.col, label=String(f.label||f.col), required=Boolean(f.required), value=cur[k]??'';
     result+=`<div>${renderSpecialInput(k,label,required,value,'data-edit-special')}</div>`;
   }
 }
 return `<div class="extra-edit-grid">${result}<div class="field-wide"><label for="editExtraNote">GHI CHÚ THAO TÁC</label><textarea id="editExtraNote">${E(r.note||'')}</textarea></div></div>`;

<div id="hubUpdateBackdrop" role="dialog" aria-modal="true" aria-labelledby="hubUpdateTitle">

<script>
(function(){
 'use strict';
 const CURRENT_HUB_VERSION='9.7.0';
 const CHECK_INTERVAL_MS=3*60*1000;
 let checking=false,pendingVersion='',ignoredVersion='';
 const backdrop=document.getElementById('hubUpdateBackdrop');
 const updateBtn=document.getElementById('hubUpdateNow');
 const laterBtn=document.getElementById('hubUpdateLater');
 const msg=document.getElementById('hubUpdateMessage');
 const warn=document.getElementById('hubUpdateWarning');
 const getSafety=()=>typeof window.sutHubUpdateSafety==='function'
   ?window.sutHubUpdateSafety():{active:0,unsynced:0,screen:'start'};
 function versionCmp(a,b){
  const p=v=>String(v||'').split('.').map(x=>Number(x)||0);
  const x=p(a),y=p(b);
  for(let i=0;i<Math.max(x.length,y.length);i++){
   if((x[i]||0)>(y[i]||0))return 1;
   if((x[i]||0)<(y[i]||0))return -1;
  }

 }

  pendingVersion=v;

    ' Chọn CẬP NHẬT NGAY để lấy giao diện mới.';
  const safety=getSafety();
  if(safety.active||safety.unsynced){
   const chunks=[];
   if(safety.active)chunks.push(safety.active+' mẫu đang đo');
   if(safety.unsynced)chunks.push(safety.unsynced+' yêu cầu chưa đồng bộ');

   warn.textContent='Lưu ý: Thiết bị đang có '+chunks.join(' và ')+
     '. Nên STOP và gửi dữ liệu chờ lên SharePoint trước khi cập nhật. Dữ liệu local không bị chủ động xóa.';

   });

 }

  if(!pendingVersion)return;
  const safety=getSafety();
  if(safety.active||safety.unsynced){
   renderNotice(pendingVersion,'');
   const confirmText='Đang có dữ liệu đo hoặc yêu cầu đồng bộ chưa hoàn tất. '+
      'Bạn có chắc muốn tải lại trang? Dữ liệu local sẽ được giữ nguyên nếu trình duyệt hỗ trợ lưu trữ.';
   if(!window.confirm(confirmText))return;
